# =============================================================================
# Telegraf - VARIANTE PARA DOCKER COMPOSE (canónico = conf/telegraf.conf)
# Topología replicada en compose:
#   influxdb-01  (monitorización, recibe la DB telegraf)  <- output aquí
#   kapacitor-01 (alertas, suscrito a influxdb-01, carga los TICKscripts)
#   influxdb-02  (datos)
#   kapacitor-02..05 (conectados a influxdb-02)
# Diferencias con el canónico:
#   - urls a los nombres de servicio de la red de compose.
#   - SIN inputs.procstat (procesos en contenedores separados): paneles de
#     uptime de proceso / RSS / FDs quedan vacíos en local.
#   - inputs.tail de queries lentas queda documentado (comentado): influxd
#     loguea a stdout en la imagen, no a un fichero compartido.
# Los tags service/instance son idénticos al canónico.
# =============================================================================

[global_tags]
  env = "docker"
  stack = "tick"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "10s"
  flush_jitter = "2s"
  precision = ""
  hostname = ""
  omit_hostname = false

# -----------------------------------------------------------------------------
# SALIDA: InfluxDB de monitorización (influxdb-01)
# -----------------------------------------------------------------------------
[[outputs.influxdb]]
  urls = ["http://influxdb-01:8086"]
  database = "telegraf"
  retention_policy = "autogen"
  timeout = "5s"

# =============================================================================
# ENTRADAS - STACK TICK
# =============================================================================

# --- InfluxDB internals (/debug/vars) -> measurements influxdb_* -------------
[[inputs.influxdb]]
  urls = ["http://influxdb-01:8086/debug/vars"]
  timeout = "5s"
  [inputs.influxdb.tags]
    instance = "influxdb-01"

[[inputs.influxdb]]
  urls = ["http://influxdb-02:8086/debug/vars"]
  timeout = "5s"
  [inputs.influxdb.tags]
    instance = "influxdb-02"

# --- Kapacitor internals (/debug/vars) -> measurements kapacitor_* -----------
[[inputs.kapacitor]]
  urls = ["http://kapacitor-01:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"
  [inputs.kapacitor.tags]
    instance = "kapacitor-01"

[[inputs.kapacitor]]
  urls = ["http://kapacitor-02:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"
  [inputs.kapacitor.tags]
    instance = "kapacitor-02"

[[inputs.kapacitor]]
  urls = ["http://kapacitor-03:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"
  [inputs.kapacitor.tags]
    instance = "kapacitor-03"

[[inputs.kapacitor]]
  urls = ["http://kapacitor-04:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"
  [inputs.kapacitor.tags]
    instance = "kapacitor-04"

[[inputs.kapacitor]]
  urls = ["http://kapacitor-05:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"
  [inputs.kapacitor.tags]
    instance = "kapacitor-05"

# --- Health checks / disponibilidad: 2 influx + 5 kapacitor ------------------
[[inputs.http_response]]
  urls = ["http://influxdb-01:8086/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    # "service" y no "server": el plugin ya fija "server" (= la URL) y lo pisaria.
    service = "influxdb"
    instance = "influxdb-01"

[[inputs.http_response]]
  urls = ["http://influxdb-02:8086/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "influxdb"
    instance = "influxdb-02"

[[inputs.http_response]]
  urls = ["http://kapacitor-01:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "kapacitor"
    instance = "kapacitor-01"

[[inputs.http_response]]
  urls = ["http://kapacitor-02:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "kapacitor"
    instance = "kapacitor-02"

[[inputs.http_response]]
  urls = ["http://kapacitor-03:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "kapacitor"
    instance = "kapacitor-03"

[[inputs.http_response]]
  urls = ["http://kapacitor-04:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "kapacitor"
    instance = "kapacitor-04"

[[inputs.http_response]]
  urls = ["http://kapacitor-05:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "kapacitor"
    instance = "kapacitor-05"

# =============================================================================
# ENTRADAS - HOST (Capacity)
# =============================================================================
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.kernel]]

# --- /metrics (Prometheus) de ambos InfluxDB: go_gc_duration_seconds ---------
[[inputs.prometheus]]
  urls = ["http://influxdb-01:8086/metrics"]
  metric_version = 2
  [inputs.prometheus.tags]
    service = "influxdb"
    instance = "influxdb-01"

[[inputs.prometheus]]
  urls = ["http://influxdb-02:8086/metrics"]
  metric_version = 2
  [inputs.prometheus.tags]
    service = "influxdb"
    instance = "influxdb-02"

# --- Métricas internas del propio Telegraf -----------------------------------
[[inputs.internal]]
  collect_memstats = true

# --- MEJORA #4 (queries lentas): DOCUMENTADO, no activo en docker ------------
# influxd loguea a stdout en la imagen oficial (no a un fichero que Telegraf
# pueda seguir). En un despliegue real, con influxd logueando a
# /var/log/influxdb/influxd.log, activa el [[inputs.tail]] del conf canónico.
# El panel "Queries lentas/min" del dashboard 02 quedará vacío en local.

# =============================================================================
# PROCESSORS
# =============================================================================
[[processors.starlark]]
  namepass = ["http_response"]
  source = '''
def apply(metric):
    rc = metric.fields.get("result_code")
    metric.fields["up"] = 1.0 if rc == 0 else 0.0
    return metric
'''

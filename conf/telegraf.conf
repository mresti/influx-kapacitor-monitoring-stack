# =============================================================================
# Telegraf - recolección de métricas para observar InfluxDB 1.8.10 y Kapacitor 1.8.2
# Escribe todo en la base de datos "telegraf" de InfluxDB (RP "autogen").
# Los dashboards de Chronograf consultan esa base de datos.
# =============================================================================

[global_tags]
  # Etiquetas globales útiles para filtrar por entorno/stack en los dashboards
  env = "prod"
  stack = "tick"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "10s"
  flush_jitter = "2s"
  precision = ""
  hostname = ""            # vacío = usa el hostname del SO (tag "host")
  omit_hostname = false

# -----------------------------------------------------------------------------
# SALIDA: InfluxDB v1
# -----------------------------------------------------------------------------
[[outputs.influxdb]]
  urls = ["http://localhost:8086"]
  database = "telegraf"
  retention_policy = "autogen"
  timeout = "5s"
  # MEJORA #8 (hardening): en producción activa auth y TLS en InfluxDB y rellena:
  # username = "telegraf"
  # password = "${INFLUX_TELEGRAF_PASSWORD}"   # usar variable de entorno, no texto plano
  # tls_ca   = "/etc/telegraf/ca.pem"
  # insecure_skip_verify = false
  # skip_database_creation = false

# =============================================================================
# ENTRADAS - STACK TICK
# =============================================================================

# --- InfluxDB internals (/debug/vars) -> measurements influxdb_* -------------
[[inputs.influxdb]]
  urls = ["http://localhost:8086/debug/vars"]
  timeout = "5s"
  ## Si tienes varios InfluxDB, añade todas las URLs aquí; el tag "url"
  ## diferencia cada instancia en los dashboards.
  # urls = [
  #   "http://influx-01:8086/debug/vars",
  #   "http://influx-02:8086/debug/vars",
  # ]

# --- Kapacitor internals (/debug/vars) -> measurements kapacitor_* -----------
[[inputs.kapacitor]]
  urls = ["http://localhost:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"
  ## Igual que arriba: añade todas las instancias de Kapacitor.
  # urls = [
  #   "http://kapacitor-01:9092/kapacitor/v1/debug/vars",
  #   "http://kapacitor-02:9092/kapacitor/v1/debug/vars",
  # ]

# --- Health checks / disponibilidad (base del SLA) ---------------------------
# /ping de InfluxDB devuelve 204; result_code=0 => OK.
[[inputs.http_response]]
  urls = ["http://localhost:8086/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    server = "influxdb"
    instance = "influxdb-01"

# /kapacitor/v1/ping devuelve 204; result_code=0 => OK.
[[inputs.http_response]]
  urls = ["http://localhost:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    server = "kapacitor"
    instance = "kapacitor-01"

# --- Procesos concretos (CPU/RAM/FDs de influxd y kapacitord) ----------------
[[inputs.procstat]]
  pattern = "influxd"
  [inputs.procstat.tags]
    service = "influxdb"

[[inputs.procstat]]
  pattern = "kapacitord"
  [inputs.procstat.tags]
    service = "kapacitor"

# =============================================================================
# ENTRADAS - HOST (Capacity)
# =============================================================================
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]   # da load1/5/15, n_cpus y uptime del host

[[inputs.processes]]

[[inputs.kernel]]

# --- /metrics (Prometheus) de InfluxDB: métricas Go + go_gc_duration_seconds --
# MEJORA #6: en InfluxDB 1.8 /metrics SOLO expone métricas Go (no histogramas
# de latencia de request, eso es 2.x). Lo usamos para percentiles de pausa GC
# (go_gc_duration_seconds es un summary con tag "quantile").
[[inputs.prometheus]]
  urls = ["http://localhost:8086/metrics"]
  metric_version = 1            # measurement = "prometheus"; go_gc_duration_seconds con tag "quantile"
  [inputs.prometheus.tags]
    server = "influxdb"
    instance = "influxdb-01"

# --- Métricas internas del propio Telegraf (para detectar buffer lleno) ------
[[inputs.internal]]
  collect_memstats = true

# =============================================================================
# PROCESSORS
# =============================================================================
# MEJORA #1/#2/#3: convierte result_code de los health checks en un campo
# numérico "up" (1 = OK, 0 = caído). Permite calcular SLA en InfluxQL sencillo
# (mean("up")*100) y, sobre todo, downsamplearlo con una Continuous Query.
[[processors.starlark]]
  namepass = ["http_response"]
  source = '''
def apply(metric):
    rc = metric.fields.get("result_code")
    metric.fields["up"] = 1.0 if rc == 0 else 0.0
    return metric
'''

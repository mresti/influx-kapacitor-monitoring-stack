# =============================================================================
# Kapacitor v1.8.2 - configuración orientada a observabilidad
# El endpoint /kapacitor/v1/debug/vars está siempre disponible cuando el HTTP
# está activo; es lo que lee el input "kapacitor" de Telegraf.
# =============================================================================

hostname = "kapacitor-01"
data_dir = "/var/lib/kapacitor"

[http]
  bind-address = ":9092"
  auth-enabled = false                 # MEJORA #8: en prod -> true
  log-enabled = true
  write-tracing = false
  pprof-enabled = true
  https-enabled = false                # MEJORA #8: en prod -> true + https-certificate
  # https-certificate = "/etc/ssl/kapacitor.pem"
  # /kapacitor/v1/ping (204) lo usan los health checks de Telegraf
  # /kapacitor/v1/debug/vars lo usa el input kapacitor de Telegraf

[logging]
  file = "STDERR"
  level = "INFO"

# -----------------------------------------------------------------------------
# Conexión a InfluxDB (suscripciones para recibir el stream de datos).
# -----------------------------------------------------------------------------
[[influxdb]]
  enabled = true
  default = true
  name = "influxdb-01"
  urls = ["http://localhost:8086"]
  username = ""
  password = ""
  timeout = "0s"
  # Las suscripciones generan tráfico; se ve reflejado en kapacitor_ingress
  subscription-protocol = "http"
  subscriptions-sync-interval = "1m0s"
  # excluded-subscriptions evita re-suscribirse a las DB de monitorización
  [influxdb.excluded-subscriptions]
    _internal = ["autogen", "monitor"]
    _kapacitor = ["autogen"]

# -----------------------------------------------------------------------------
# Carga de TICKscripts desde directorio (más cómodo de operar).
# -----------------------------------------------------------------------------
[load]
  enabled = true
  dir = "/etc/kapacitor/load"

# -----------------------------------------------------------------------------
# [stats] -> ALTERNATIVA/COMPLEMENTO a Telegraf: Kapacitor puede auto-escribir
# sus estadísticas a InfluxDB. Para estos dashboards usamos Telegraf, pero lo
# dejamos disponible (no molesta y sirve de respaldo).
# -----------------------------------------------------------------------------
[stats]
  enabled = true
  stats-interval = "10s"
  database = "_kapacitor"
  retention-policy = "autogen"
  timing-sample-rate = 0.1
  timing-movavg-size = 1000

[deadman]
  global = false
  threshold = 0.0
  interval = "10s"
  id = "node 'NODE_NAME' in task '{{ .TaskName }}'"
  message = "{{ .ID }} is {{ if eq .Level \"OK\" }}alive{{ else }}dead{{ end }}: {{ index .Fields \"emitted\" | printf \"%0.3f\" }} points/INTERVAL."

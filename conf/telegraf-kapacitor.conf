# =============================================================================
# Telegraf - ROL Kapacitor (despliegue real, UN Telegraf por host)
# Observa el Kapacitor LOCAL de este host (localhost:9092) y las métricas del
# host. Escribe en la DB "telegraf" del InfluxDB de monitorización.
#
# Topología real = un Telegraf por instancia:
#   este conf corre junto a cada kapacitord; sondea solo localhost.
#   El tag "instance" (env INSTANCE_NAME) identifica la instancia en los
#   dashboards; se interpola en el regex =~ /^:instance:$/ de Chronograf, así
#   que SOLO admite [A-Za-z0-9_-] (nada de "/" ni metacaracteres regex).
# =============================================================================

[global_tags]
  # Etiquetas globales útiles para filtrar por entorno/stack en los dashboards
  env = "prod"
  stack = "tick"
  # OBLIGATORIA. Solo [A-Za-z0-9_-]: se interpola en =~ /^:instance:$/.
  # Sin INSTANCE_NAME definido, cae a "unset-instance" (fallo visible en el
  # dropdown en vez de un tag vacío silencioso).
  instance = "${INSTANCE_NAME:-unset-instance}"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "10s"
  flush_jitter = "2s"
  precision = ""
  hostname = ""            # vacío = usa el hostname del SO (tag "host")
  omit_hostname = false

# -----------------------------------------------------------------------------
# SALIDA: InfluxDB de monitorización (por env MONITOR_INFLUX_URL)
# -----------------------------------------------------------------------------
[[outputs.influxdb]]
  urls = ["${MONITOR_INFLUX_URL}"]
  database = "telegraf"
  retention_policy = "autogen"
  timeout = "5s"
  # MEJORA #8 (hardening): en producción activa auth y TLS en InfluxDB y rellena:
  # username = "telegraf"
  # password = "${INFLUX_TELEGRAF_PASSWORD}"   # usar variable de entorno, no texto plano
  # tls_ca   = "/etc/telegraf/ca.pem"
  # insecure_skip_verify = false
  # skip_database_creation = false

# =============================================================================
# ENTRADAS - KAPACITOR LOCAL
# =============================================================================
# NO poner tag "instance" a nivel plugin: pisaría al global_tag por host.
# Convención "service" (no "server": el plugin ya fija "server" = la URL).

# --- Kapacitor internals (/debug/vars) -> measurements kapacitor_* -----------
[[inputs.kapacitor]]
  urls = ["http://localhost:9092/kapacitor/v1/debug/vars"]
  timeout = "5s"

# --- API de alertas (topics + handlers): NO sale en /debug/vars --------------
# Ambos endpoints responden 200 en CUALQUIER Kapacitor: en los que no cargan
# TICKscripts devuelven listas vacias ({"topics":[]} / {"handlers":[]}), no 404
# (verificado contra Kapacitor 1.8.2). Con `optional = true` eso no genera
# error ni puntos, asi que este mismo conf vale para todos los hosts del rol:
# solo el Kapacitor de alertas producira datos.

# "level" va como FIELD string (no tag): es el nivel ACTUAL del topic y cambia
# (OK<->CRITICAL) en cada transicion; como tag generaria una serie nueva por
# nivel y ademas impediria la query last("level") de la tabla del dashboard 03.
[[inputs.http]]
  urls = ["http://localhost:9092/kapacitor/v1/alerts/topics"]
  method = "GET"
  timeout = "5s"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    measurement_name = "kapacitor_topics_api"
    [[inputs.http.json_v2.object]]
      path = "topics"
      optional = true
      # Solo lo util: descarta los sub-objetos link/events-link/handlers-link.
      included_keys = ["id", "level", "collected"]
      tags = ["id"]

# "options" queda FUERA a proposito: puede contener secretos (webhook de Slack,
# credenciales SMTP) y no deben acabar escritos en InfluxDB.
[[inputs.http]]
  urls = ["http://localhost:9092/kapacitor/v1/alerts/topics/infra/handlers"]
  method = "GET"
  timeout = "5s"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    measurement_name = "kapacitor_handlers"
    [[inputs.http.json_v2.object]]
      path = "handlers"
      optional = true
      included_keys = ["id", "kind", "match"]
      tags = ["id"]

# --- Health check / disponibilidad (base del SLA): /ping devuelve 204 --------
[[inputs.http_response]]
  urls = ["http://localhost:9092/kapacitor/v1/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "kapacitor"

# --- Proceso local kapacitord (CPU/RAM/FDs) ----------------------------------
[[inputs.procstat]]
  pattern = "kapacitord"
  [inputs.procstat.tags]
    service = "kapacitor"

# =============================================================================
# ENTRADAS - HOST (Capacity)
# =============================================================================
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]   # da load1/5/15, n_cpus y uptime del host

[[inputs.processes]]

[[inputs.kernel]]

# --- Métricas internas del propio Telegraf (para detectar buffer lleno) ------
[[inputs.internal]]
  collect_memstats = true

# =============================================================================
# PROCESSORS
# =============================================================================
# MEJORA #1/#2/#3: convierte result_code de los health checks en un campo
# numérico "up" (1 = OK, 0 = caído). Permite calcular SLA en InfluxQL sencillo
# (mean("up")*100) y, sobre todo, downsamplearlo con una Continuous Query.
[[processors.starlark]]
  namepass = ["http_response"]
  source = '''
def apply(metric):
    rc = metric.fields.get("result_code")
    metric.fields["up"] = 1.0 if rc == 0 else 0.0
    return metric
'''

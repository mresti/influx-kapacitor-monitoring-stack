# =============================================================================
# Telegraf - ROL InfluxDB (despliegue real, UN Telegraf por host)
# Observa el InfluxDB LOCAL de este host (localhost) y las métricas del host.
# Escribe en la DB "telegraf" del InfluxDB de monitorización (RP "autogen").
#
# Topología real = un Telegraf por instancia:
#   este conf corre junto a cada influxd; sondea solo localhost.
#   El tag "instance" (env INSTANCE_NAME) identifica la instancia en los
#   dashboards; se interpola en el regex =~ /^:instance:$/ de Chronograf, así
#   que SOLO admite [A-Za-z0-9_-] (nada de "/" ni metacaracteres regex).
# =============================================================================

[global_tags]
  # Etiquetas globales útiles para filtrar por entorno/stack en los dashboards
  env = "prod"
  stack = "tick"
  # OBLIGATORIA. Solo [A-Za-z0-9_-]: se interpola en =~ /^:instance:$/.
  # Sin INSTANCE_NAME definido, cae a "unset-instance" (fallo visible en el
  # dropdown en vez de un tag vacío silencioso).
  instance = "${INSTANCE_NAME:-unset-instance}"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "10s"
  flush_jitter = "2s"
  precision = ""
  hostname = ""            # vacío = usa el hostname del SO (tag "host")
  omit_hostname = false

# -----------------------------------------------------------------------------
# SALIDA: InfluxDB de monitorización (por env MONITOR_INFLUX_URL)
# -----------------------------------------------------------------------------
[[outputs.influxdb]]
  urls = ["${MONITOR_INFLUX_URL}"]
  database = "telegraf"
  retention_policy = "autogen"
  timeout = "5s"
  # MEJORA #8 (hardening): en producción activa auth y TLS en InfluxDB y rellena:
  # username = "telegraf"
  # password = "${INFLUX_TELEGRAF_PASSWORD}"   # usar variable de entorno, no texto plano
  # tls_ca   = "/etc/telegraf/ca.pem"
  # insecure_skip_verify = false
  # skip_database_creation = false

# =============================================================================
# ENTRADAS - INFLUXDB LOCAL
# =============================================================================
# NO poner tag "instance" a nivel plugin: pisaría al global_tag por host.
# Convención "service" (no "server": el plugin ya fija "server" = la URL).

# --- InfluxDB internals (/debug/vars) -> measurements influxdb_* -------------
[[inputs.influxdb]]
  urls = ["http://localhost:8086/debug/vars"]
  timeout = "5s"

# --- Health check / disponibilidad (base del SLA): /ping devuelve 204 --------
[[inputs.http_response]]
  urls = ["http://localhost:8086/ping"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = false
  [inputs.http_response.tags]
    service = "influxdb"

# --- /metrics (Prometheus): métricas Go + go_gc_duration_seconds -------------
# MEJORA #6: en InfluxDB 1.8 /metrics SOLO expone métricas Go (no histogramas
# de latencia de request, eso es 2.x). Lo usamos para percentiles de pausa GC
# (go_gc_duration_seconds es un summary con tag "quantile").
[[inputs.prometheus]]
  urls = ["http://localhost:8086/metrics"]
  metric_version = 2           # measurement = "prometheus"; go_gc_duration_seconds como campo con tag "quantile"
  [inputs.prometheus.tags]
    service = "influxdb"

# --- Proceso local influxd (CPU/RAM/FDs) -------------------------------------
[[inputs.procstat]]
  pattern = "influxd"
  [inputs.procstat.tags]
    service = "influxdb"

# =============================================================================
# ENTRADAS - HOST (Capacity)
# =============================================================================
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]   # da load1/5/15, n_cpus y uptime del host

[[inputs.processes]]

[[inputs.kernel]]

# --- Métricas internas del propio Telegraf (para detectar buffer lleno) ------
[[inputs.internal]]
  collect_memstats = true

# --- MEJORA #4 (queries lentas): tail del log de InfluxDB -------------------
# InfluxDB escribe una línea por query que supera `log-queries-after` (10s en
# influxdb.conf). Este input las cuenta -> measurement "influxdb_slow_queries".
# Requiere `access-log-path`/log a fichero y que Telegraf pueda leerlo (corre
# en el mismo host que influxd). DESHABILITADO por defecto; actívalo
# descomentando y ajustando la ruta:
# [[inputs.tail]]
#   files = ["/var/log/influxdb/influxd.log"]
#   from_beginning = false
#   name_override = "influxdb_slow_queries"
#   data_format = "grok"
#   grok_patterns = ['%{TIMESTAMP_ISO8601:timestamp:ts-rfc3339} .*%{NUMBER:duration_ms:float}.*"%{DATA:query}"']
#   ## Filtra solo líneas de query lenta; el mensaje de InfluxDB contiene
#   ## "[query]" y el tiempo tras `log-queries-after`. Ajusta el patrón a tu
#   ## formato de log real (varía entre builds de 1.8).
#   [inputs.tail.tags]
#     service = "influxdb"

# =============================================================================
# PROCESSORS
# =============================================================================
# MEJORA #1/#2/#3: convierte result_code de los health checks en un campo
# numérico "up" (1 = OK, 0 = caído). Permite calcular SLA en InfluxQL sencillo
# (mean("up")*100) y, sobre todo, downsamplearlo con una Continuous Query.
[[processors.starlark]]
  namepass = ["http_response"]
  source = '''
def apply(metric):
    rc = metric.fields.get("result_code")
    metric.fields["up"] = 1.0 if rc == 0 else 0.0
    return metric
'''

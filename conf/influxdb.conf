# =============================================================================
# InfluxDB OSS v1.8.10 - configuración orientada a observabilidad
# Solo se incluyen las secciones relevantes para que Telegraf/Chronograf
# puedan recolectar métricas internas. El resto de parámetros pueden
# mantenerse con sus valores por defecto.
# =============================================================================

reporting-disabled = true
# bind-address del servicio RPC interno (no es el HTTP)
bind-address = "127.0.0.1:8088"

[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  # Exponer estadísticas de TSM/series por shard al _internal
  index-version = "tsi1"               # tsi1 reduce uso de memoria (recomendado)
  trace-logging-enabled = false
  query-log-enabled = true
  # Estas métricas se vuelcan a "_internal" como tsm1_cache, tsm1_wal, shard...
  max-series-per-database = 1000000    # 0 = ilimitado; vigílalo en Capacity
  max-values-per-tag = 100000          # protege contra alta cardinalidad

# -----------------------------------------------------------------------------
# [monitor] -> ESTO es lo que llena la base de datos "_internal".
# Imprescindible para la observabilidad self-hosted.
# -----------------------------------------------------------------------------
[monitor]
  store-enabled = true
  store-database = "_internal"
  store-interval = "10s"

# -----------------------------------------------------------------------------
# [http] -> habilita /debug/vars (lo que lee el input "influxdb" de Telegraf),
# /metrics (formato Prometheus) y Flux (necesario para los paneles de SLA).
# -----------------------------------------------------------------------------
[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = false                 # MEJORA #8: en prod -> true (y crea usuarios/roles)
  log-enabled = true
  write-tracing = false
  flux-enabled = true                  # <-- necesario para algún panel Flux (uptime de proceso)
  pprof-enabled = true                 # expone /debug/pprof y asegura /debug/vars
  ping-auth-enabled = false            # /ping accesible para los health checks
  # MEJORA #8 (hardening) en producción:
  # https-enabled = true
  # https-certificate = "/etc/ssl/influxdb.pem"
  # https-private-key = "/etc/ssl/influxdb-key.pem"
  # access-log-path = "/var/log/influxdb/access.log"
  # max-body-size = 25000000

[continuous_queries]
  enabled = true
  log-enabled = true

[logging]
  format = "auto"
  level = "info"

[coordinator]
  # Visibles en queryExecutor; útiles para Capacity/queries lentas
  query-timeout = "0s"
  log-queries-after = "10s"            # marca queries lentas en el log
  max-concurrent-queries = 0           # 0 = ilimitado
  max-select-point = 0
